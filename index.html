<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 ワンクリック更新</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 50px 20px; }
        .card { max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { font-size: 20px; color: #0066cc; margin-bottom: 20px; }
        .btn { background: #0076ff; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        #status { margin-top: 25px; font-weight: bold; background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; min-height: 24px; }
    </style>
</head>
<body>

<div class="card">
    <h1>XIAO nRF52840 全自動アップデート</h1>
    <p>USBでPCに接続し、下のボタンを1回だけ押してください。</p>

    <button id="updateBtn" class="btn">アップデートを開始する</button>
    <div id="status">デバイスの接続を待っています...</div>
</div>

<script>
const updateBtn = document.getElementById('updateBtn');
const statusDiv = document.getElementById('status');

// Web Serial APIが使えるか確認
if (!('serial' in navigator)) {
    updateBtn.disabled = true;
    statusDiv.style.color = 'red';
    statusDiv.innerText = 'エラー: お使いのブラウザは対応していません。ChromeまたはEdgeをご使用ください。';
}

updateBtn.addEventListener('click', async () => {
    try {
        updateBtn.disabled = true;
        statusDiv.style.color = '#333';
        statusDiv.innerText = '1. ポップアップからXIAOを選択してください...';

        // 【ステップ1】 ユーザーのクリック直後にポップアップを開く
        const currentPort = await navigator.serial.requestPort();
        
        statusDiv.innerText = '2. 自動リセット信号（1200bps）を送信中...';
        
        // ★重要：変身後の「新しいXIAO（ブートローダー）」がUSBに挿さる瞬間を待ち受けるイベントをセット
        const bootloaderPromise = new Promise((resolve) => {
            const onConnect = (event) => {
                // 新しく検出されたポート（変身後のブートローダーポート）を返す
                navigator.serial.removeEventListener('connect', onConnect);
                resolve(event.target);
            };
            navigator.serial.addEventListener('connect', onConnect);
        });

        // 1200bpsで開き、ケース内ボタン2回押しを再現してすぐ閉じる
        await currentPort.open({ baudRate: 1200 });
        await new Promise(resolve => setTimeout(resolve, 200));
        await currentPort.close(); // ここでXIAOのポートが消滅する

        statusDiv.innerText = '3. デバイスの再起動・自動検出を待っています...';

        // ★自動追跡：新しくUSBに出現したブートローダーポートをプログラムが自動でキャッチ
        const dfuPort = await bootloaderPromise;

        statusDiv.innerText = '4. 自動再接続しました。プログラムを書き込み中...';
        
        // 115200bpsで本番の書き込み接続を開始
        await dfuPort.open({ baudRate: 115200 });

        // サーバーから最新のファームウェアバイナリをダウンロード
        const response = await fetch('HIKIGANE_V3.1_RT.bin');
        if (!response.ok) throw new Error('ファームウェアファイルが見つかりません。');
        const arrayBuffer = await response.arrayBuffer();
        const firmwareData = new Uint8Array(arrayBuffer);

        // データの送信処理（直接ダウンロード）
        const writer = dfuPort.writable.getWriter();
        const chunkSize = 64;
        let offset = 0;

        while (offset < firmwareData.length) {
            const chunk = firmwareData.slice(offset, offset + chunkSize);
            await writer.write(chunk);
            offset += chunkSize;
        }

        await writer.close();
        await dfuPort.close();

        statusDiv.style.color = 'green';
        statusDiv.innerText = '🎉 完全完了しました！プログラムが自動起動します。';
        updateBtn.disabled = false;

    } catch (error) {
        console.error(error);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'エラー: ' + error.message;
        updateBtn.disabled = false;
    }
});
</script>

</body>
</html>
