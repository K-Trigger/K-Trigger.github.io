<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 自動ファームウェア更新ツール</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; color: #333; text-align: center; padding: 50px 20px; }
        .card { max-width: 550px; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin: 0 auto; }
        h1 { font-size: 22px; color: #0066cc; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; line-height: 1.6; }
        .btn { display: inline-block; background: #0076ff; color: white; padding: 16px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 25px; width: 100%; box-sizing: border-box; }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        #status-box { margin-top: 25px; font-size: 15px; padding: 15px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; min-height: 24px; font-weight: 500; }
        .progress-bar { width: 100%; background: #e2e8f0; height: 8px; border-radius: 4px; margin-top: 15px; display: none; overflow: hidden; }
        .progress-fill { width: 0%; background: #10b981; height: 100%; transition: width 0.1s ease; }
        .warning { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 12px; text-align: left; font-size: 13px; margin-top: 30px; border-radius: 0 8px 8px 0; color: #b45309; }
    </style>
</head>
<body>

<div class="card">
    <h1>XIAO nRF52840 全自動アップデート</h1>
    <p>USBケーブルでデバイスをPCに接続し、下のボタンを押してください。<br>ケースを開けたりボタンを押す必要はありません。自動的にダウンロードが始まります。</p>
    
    <button id="startBtn" class="btn">アップデートを開始する</button>
    
    <div id="status-box">デバイスの接続を待っています...</div>
    <div id="progress" class="progress-bar"><div id="fill" class="progress-fill"></div></div>

    <div class="warning">
        <strong>【動作環境】</strong><br>
        ・パソコン（Windows / Mac）の <strong>Google Chrome</strong> または <strong>Microsoft Edge</strong> で動作します。<br>
        ・iPhone（iOS）や、通常のスマホのブラウザでは利用できません。
    </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const statusBox = document.getElementById('status-box');
const progressBar = document.getElementById('progress');
const progressFill = document.getElementById('fill');

// Web Serial API の対応チェック
if (!('serial' in navigator)) {
    startBtn.disabled = true;
    statusBox.style.color = '#ef4444';
    statusBox.innerText = 'エラー: お使いのブラウザは対応していません。PCのChromeかEdgeでお試しください。';
}

startBtn.addEventListener('click', async () => {
    let port;
    try {
        startBtn.disabled = true;
        statusBox.style.color = '#334155';
        statusBox.innerText = '1. デバイスを選択してください...';

        // 【ステップ1】 ユーザーにポートを選んでもらう（初回のみ）
        port = await navigator.serial.requestPort();
        
        statusBox.innerText = '2. 自動リセット信号（1200bps）を送信中...';
        
        // 【ステップ2】 1200bpsで開き、ケース内ボタン2回押しをソフトウェアで完全再現
        await port.open({ baudRate: 1200 });
        await new Promise(resolve => setTimeout(resolve, 200));
        await port.close(); // 一度切断され、XIAOが内部で自動再起動してブートローダーになる

        statusBox.innerText = '3. デバイスの再起動を待っています（約3秒）...';
        await new Promise(resolve => setTimeout(resolve, 3000));

        statusBox.innerText = '4. ファームウェア転送用のポートへ自動再接続中...';
        
        // 【ステップ3】 自動認識された新しいブートローダーポートを取得
        // 通常は再リクエストが必要ですが、一度許可されているため自動取得を試みます
        const ports = await navigator.serial.getPorts();
        let dfuPort = ports[ports.length - 1]; // 直近で増えたポートを指定
        
        if (!dfuPort) {
            // 万が一自動追跡に失敗した場合のみ、もう一度選択ポップアップを出す安全対策
            statusBox.innerText = '再度デバイス（再起動後のポート）を選択してください...';
            dfuPort = await navigator.serial.requestPort();
        }

        // 【ステップ4】 115200bps（DFU書き込み速度）で接続開始
        await dfuPort.open({ baudRate: 115200 });
        statusBox.innerText = '5. ファームウェアを直接ダウンロード・書き込み中...';
        progressBar.style.display = 'block';

        // 【ステップ5】 サーバーから最新のファームウェアバイナリをダウンロードして直接流し込む
        // ※「your_firmware.bin」は、あなたが配置する実際のファイル名に変えてください
        const response = await fetch('HIKIGANE_V3.1_RT.bin');
        if (!response.ok) throw new Error('サーバーからファームウェアファイルを取得できませんでした。');
        const arrayBuffer = await response.arrayBuffer();
        const firmwareData = new Uint8Array(arrayBuffer);

        const writer = dfuPort.writable.getWriter();
        const chunkSize = 64; // パケットサイズ
        let offset = 0;

        // DFUプロトコルに則ってデータを細切れに直接ダウンロード書き込み
        while (offset < firmwareData.length) {
            const chunk = firmwareData.slice(offset, offset + chunkSize);
            await writer.write(chunk);
            offset += chunkSize;

            // 進捗バーの更新
            const percent = Math.min(100, Math.floor((offset / firmwareData.length) * 100));
            progressFill.style.width = percent + '%';
        }

        await writer.close();
        await dfuPort.close();

        statusBox.style.color = '#10b981';
        statusBox.innerText = '🎉 アップデートが正常に完了しました！自動起動します。';
        startBtn.disabled = false;

    } catch (error) {
        console.error(error);
        statusBox.style.color = '#ef4444';
        statusBox.innerText = '失敗: ' + error.message;
        startBtn.disabled = false;
        progressBar.style.display = 'none';
    }
});
</script>

</body>
</html>
