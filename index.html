<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 自動アップデート</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; }
        button { color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 15px; }
        .btn-reset { background: #e67e22; }
        .btn-reset:hover { background: #d35400; }
        .btn-flash { background: #2ecc71; }
        .btn-flash:hover { background: #27ae60; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status { margin-top: 20px; color: #333; font-size: 14px; line-height: 1.6; white-space: pre-wrap; text-align: left; background: #eee; padding: 10px; border-radius: 4px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="card">
    <!-- ★ここに直接「10」を書き込みました。次回以降はここをご自身で「11」「12」と書き換えてください -->
    <h2>XIAO nRF52840<br>プログラム更新(10)</h2>
    <p>本体のリセットボタンは触りません。画面の指示に従って①、②のボタンを順番に押してください。</p>
    
    <button id="reset-btn" class="btn-reset">① XIAOを書き込みモードにする</button>
    <button id="flash-btn" class="btn-flash" disabled>② 接続して書き込む</button>
    
    <div id="status">準備完了。①のボタンを押して、接続されているXIAOを選択してください。</div>
</div>

<!-- 外部エラーを防ぐため、内部で安全にファイルを処理します -->
<script>
    window.JSZip = {
        loadAsync: async function(buffer) {
            const files = {};
            const view = new DataView(buffer);
            let pos = 0;
            while (pos < buffer.byteLength - 30) {
                if (view.getUint32(pos, true) === 0x04034b50) {
                    const nameLen = view.getUint16(pos + 26, true);
                    const compSize = view.getUint32(pos + 18, true);
                    const extraLen = view.getUint16(pos + 28, true);
                    const nameBytes = new Uint8Array(buffer, pos + 30, nameLen);
                    const name = String.fromCharCode.apply(null, nameBytes);
                    const dataPos = pos + 30 + nameLen + extraLen;
                    if (dataPos + compSize <= buffer.byteLength) {
                        const fileData = new Uint8Array(buffer, dataPos, compSize);
                        files[name] = { async: async () => fileData };
                    }
                    pos += 30 + nameLen + extraLen + compSize;
                } else { pos++; }
            }
            return { files };
        }
    };

    class DfuDriver {
        constructor(logCallback, progressCallback) {
            this.log = logCallback;
            this.progress = progressCallback;
        }
        async run(port, buffer) {
            this.log("💾 ファームウェアデータを解析中...");
            const zip = await window.JSZip.loadAsync(buffer);
            let dat = null, bin = null;
            for (const name in zip.files) {
                if (name.endsWith('.dat')) dat = await zip.files[name].async();
                if (name.endsWith('.bin')) bin = await zip.files[name].async();
            }
            if (!dat || !bin) throw new Error("ZIP内に入っているはずの .dat または .bin ファイルが見つかりません。");

            this.log("💾 転送を開始します。ポートを開きます...");
            await port.open({ baudRate: 115200 });
            const writer = port.writable.getWriter();
            
            const slipPacket = (type, data) => {
                const header = new Uint8Array([type, (data.length & 0xFF), ((data.length >> 8) & 0xFF)]);
                const pkt = new Uint8Array(header.length + data.length);
                pkt.set(header, 0); pkt.set(data, header.length);
                return pkt;
            };

            this.log("💾 同期信号を送信中...");
            await writer.write(slipPacket(1, new Uint8Array([1, 0, 0, 0, (dat.length & 0xFF), ((dat.length >> 8) & 0xFF), 0, 0])));
            await writer.write(slipPacket(2, dat));
            await writer.write(slipPacket(4, new Uint8Array(0)));

            const chunkSize = 256;
            await writer.write(slipPacket(1, new Uint8Array([2, 0, 0, 0, (bin.length & 0xFF), ((bin.length >> 8) & 0xFF), ((bin.length >> 16) & 0xFF), 0])));
            
            for (let i = 0; i < bin.length; i += chunkSize) {
                const chunk = bin.slice(i, i + chunkSize);
                await writer.write(slipPacket(2, chunk));
                this.progress(Math.round((i / bin.length) * 100));
            }
            
            await writer.write(slipPacket(4, new Uint8Array(0)));
            this.progress(100);

            writer.releaseLock();
            await port.close();
        }
    }
</script>

<script>
    const resetBtn = document.getElementById('reset-btn');
    const flashBtn = document.getElementById('flash-btn');
    const statusDiv = document.getElementById('status');
    const firmwarePath = './HIKIGANE_V3.1_RT.zip'; 

    function log(msg) { statusDiv.innerText = msg; }

    // ① DFUモード切り替え
    resetBtn.addEventListener('click', async () => {
        try {
            log("接続するXIAOを選択してください...");
            const port = await navigator.serial.requestPort();
            log("🔄 DFUモードへの切り替え命令を送信中...");
            await port.open({ baudRate: 1200 });
            await port.close();
            log("⏳ XIAOが再起動しています... 4秒ほどお待ちください。");
            resetBtn.disabled = true;
            setTimeout(() => {
                log("準備完了！\n②のボタンを押して、もう一度デバイスを選択してください。");
                flashBtn.disabled = false;
            }, 4000);
        } catch (error) {
            log(`❌ エラー: ${error.message}`);
            resetBtn.disabled = false;
        }
    });

    // ② 正しいDFU書き込み
    flashBtn.addEventListener('click', async () => {
        log("1. ファームウェアファイルをダウンロード中...");
        try {
            const response = await fetch(firmwarePath);
            if (!response.ok) throw new Error(`${firmwarePath} が見つかりません。`);
            const arrayBuffer = await response.arrayBuffer();

            log("2. 再起動した書き込みモードのXIAOを選択してください...");
            const port = await navigator.serial.requestPort();
            
            const driver = new DfuDriver(
                (msg) => { log(msg); },
                (pct) => { log(`💾 書き込み中: ${pct}%`); }
            );

            await driver.run(port, arrayBuffer);

            log("🎉 アップデートが正常に完了しました！XIAOが自動起動します。");
            flashBtn.disabled = true;
            resetBtn.disabled = false;

        } catch (error) {
            log("❌ エラー: " + error.message + "\nもう一度最初からやり直してください。");
            console.error(error);
        }
    });
</script>

</body>
</html>
