<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 1クリック・アプデ</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #007bc0; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005a9c; }
        #status { margin-top: 20px; color: #555; white-space: pre-wrap; font-size: 14px; }
    </style>
    <!-- JSZipの読み込み（nrf_web_tools.jsの動作に必須です） -->
    <script src="https://cloudflare.com"></script>
    <!-- 同じフォルダに置いた nrf_web_tools.js を読み込む -->
    <script src="./nrf_web_tools.js"></script>
</head>
<body>

<div class="card">
    <h2>XIAO nRF52840 プログラム更新</h2>
    <p>PCとXIAOをUSBケーブルで繋ぎ、下のボタンを押してください。</p>
    
    <!-- 1クリックで開始するボタン -->
    <button id="update-btn">アップデートを開始</button>
    
    <div id="status">準備完了</div>
</div>

<script>
    // 書き込みたいZIPファイルのパス（同じフォルダにある場合）
    const FIRMWARE_URL = './HIKIGANE_V3.1_RT.zip'; 

    const updateBtn = document.getElementById('update-btn');
    const statusDiv = document.getElementById('status');

    function log(msg) {
        statusDiv.innerText = msg;
    }

    updateBtn.addEventListener('click', async () => {
        try {
            log("1. ファームウェアファイルをダウンロード中...");
            // サーバーからZIPファイルを自動で取得
            const response = await fetch(FIRMWARE_URL);
            if (!response.ok) throw new Error("ファイルのダウンロードに失敗しました。パスを確認してください。");
            const arrayBuffer = await response.arrayBuffer();

            log("2. 接続するデバイス（シリアルポート）を選んでください...");
            // ブラウザのシリアルポート選択画面をポップアップ
            const port = await navigator.serial.requestPort();

            log("3. 書き込み中...（しばらくお待ちください）");
            
            // nrf_web_tools.js の DFU インスタンスを作成
            const dfu = new NrfWebTools.Dfu();
            
            // 進捗状況を表示
            dfu.onProgress = (progress) => {
                log(`書き込み中: ${progress}%`);
            };

            // DFU書き込み実行
            await dfu.program(port, arrayBuffer);

            log("🎉 アップデートが正常に完了しました！");
        } catch (error) {
            log(`❌ エラー: ${error.message}`);
            console.error(error);
        }
    });
</script>

</body>
</html>
