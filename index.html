<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 2ステップ自動アップデート</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; }
        button { color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 15px; }
        .btn-reset { background: #e67e22; }
        .btn-reset:hover { background: #d35400; }
        .btn-flash { background: #2ecc71; }
        .btn-flash:hover { background: #27ae60; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status { margin-top: 20px; color: #333; font-size: 14px; line-height: 1.6; white-space: pre-wrap; text-align: left; background: #eee; padding: 10px; border-radius: 4px; }
    </style>
    
    <!-- JSZipライブラリの読み込み -->
    <script src="https://unpkg.com"></script>
    
    <!-- ダウンロードした nrf_web_tools.js -->
    <script src="./nrf_web_tools.js"></script>
</head>
<body>

<div class="card">
    <!-- ★ご指定通り、更新の後に連番「6」を追加しました -->
    <h2>XIAO nRF52840<br>プログラム更新(6)</h2>
    <p>本体のリセットボタンは触りません。画面の指示に従って①、②のボタンを順番に押してください。</p>
    
    <!-- ステップ1: DFUモードへ切り替えるボタン -->
    <button id="reset-btn" class="btn-reset">① XIAOを書き込みモードにする</button>
    
    <!-- ステップ2: 実際に書き込むボタン -->
    <button id="flash-btn" class="btn-flash" disabled>② 接続して書き込む</button>
    
    <div id="status">準備完了。①のボタンを押して、接続されているXIAOを選択してください。</div>
</div>

<script>
    const resetBtn = document.getElementById('reset-btn');
    const flashBtn = document.getElementById('flash-btn');
    const statusDiv = document.getElementById('status');
    const firmwarePath = './HIKIGANE_V3.1_RT.zip'; 

    function log(msg) {
        statusDiv.innerText = msg;
    }

    // --- ステップ1: 1200bpsタッチでDFUモードへ移行させる ---
    resetBtn.addEventListener('click', async () => {
        try {
            log("接続するXIAO（シリアルポート）を選んでください...");
            const port = await navigator.serial.requestPort();

            log("🔄 DFUモード（書き込みモード）への切り替え命令を送信中...");
            await port.open({ baudRate: 1200 });
            await port.close();

            log("⏳ XIAOが再起動しています... 4秒ほどお待ちください。");
            resetBtn.disabled = true;

            setTimeout(() => {
                log("準備完了！\n②のボタンを押して、もう一度デバイスを選択してください。");
                flashBtn.disabled = false;
            }, 4000);

        } catch (error) {
            log(`❌ エラー: ${error.message}`);
            console.error(error);
            resetBtn.disabled = false;
        }
    });

    // --- ステップ2: nrf_web_toolsを使った書き込み処理 ---
    document.addEventListener('DOMContentLoaded', () => {
        try {
            new NrfWebTools(flashBtn, firmwarePath);
        } catch (error) {
            console.error("ライブラリ初期化エラー:", error);
        }
    });

    flashBtn.addEventListener('click', () => {
        log("💾 書き込みを開始します。デバイスを選択すると、進行状況がパーセントで表示されます...");
    });
</script>

</body>
</html>
