<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 ファームウェア更新</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f7f6; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <h2>XIAO nRF52840 アップデート</h2>
    <p>1. XIAO をUSBケーブルでPCに接続してください。</p>
    <p>2. 下のボタンを押し、一覧から「XIAO」または「USBシリアル」を選択して接続します。</p>
    <button id="connectBtn">アップデートを開始する</button>
    <div id="status">ステータス: 待機中</div>
</div>

<!-- Web Serial を簡単に扱うためのAdafruit製ベースのライブラリ（一例） -->
<script type="module">
    // ※ 実際の運用では、Adafruitの web-serial-chromeflasher などのスクリプトを読み込みます
    import { AdafruitWebSerial } from 'https://unpkg.com';

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');

    // すでにあるファームウェアファイルのURL（同じフォルダに置いておく）
    const FIRMWARE_URL = './HIKIGANE_V3_RR.ino.hex'; 

    connectBtn.addEventListener('click', async () => {
        statusDiv.innerText = "ステータス: ブラウザでデバイスを選択中...";
        try {
            // 1. ユーザーにシリアルポート（XIAO）を選択してもらう
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            statusDiv.innerText = "ステータス: 接続完了。ファイルをダウンロード中...";

            // 2. サーバーから HEX（またはBIN）ファイルを読み込む
            const response = await fetch(FIRMWARE_URL);
            const data = await response.text();

            statusDiv.innerText = "ステータス: 書き込み中...（絶対にケーブルを抜かないでください）";
            
            // 3. マイコン（ブートローダー）にデータを送信して書き換える
            // ※ ここでライブラリに応じた書き込み関数（Intel HEX形式の解析と転送）を実行します
            
            statusDiv.innerText = "ステータス: 🎉 アップデートが正常に完了しました！";
        } catch (error) {
            statusDiv.innerText = `エラー: ${error.message}`;
            console.error(error);
        }
    });
</script>

</body>
</html>
