<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 Web USB Updater</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
        h1 { color: #0066cc; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .step { margin-bottom: 25px; padding: 15px; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; }
        button { background-color: #0066cc; color: white; border: none; padding: 12px 24px; font-size: 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0052a3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { font-weight: bold; padding: 12px; border-radius: 4px; background: #eef; margin-top: 15px; border-left: 5px solid #0066cc; }
        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 4px; margin-top: 15px; display: none; }
        .progress-bar { width: 0%; height: 20px; background-color: #4caf50; border-radius: 4px; text-align: center; line-height: 20px; color: white; font-size: 12px; }
    </style>
</head>
<body>

    <h1>XIAO nRF52840 Web USB Updater 03</h1>
    <p>UF2ファイルをWebUSB経由で直接フラッシュに書き込み、自動起動させます。</p>

    <div class="card">
        <div class="step">
            <strong>📁 [準備] ファームウェアファイルの選択</strong><br><br>
            <input type="file" id="uf2File" accept=".uf2">
        </div>

        <div class="step">
            <strong>1️⃣ [ステップ 1] XIAOをリセットする (Web Serial)</strong>
            <button id="resetBtn">XIAOを選択してリセット</button>
        </div>

        <div class="step">
            <strong>2️⃣ [ステップ 2] UF2ファイルを書き込む (WebUSB)</strong>
            <p style="font-size:13px; margin:5px 0; color:#666;">ほたる点滅に変わったら押してください。接続画面では「XIAO nRF52840」または「nRF52840 DFU」等を選択します。</p>
            <button id="writeBtn" disabled>ブートローダーにWebUSB接続して書き込み</button>
        </div>

        <div id="status">ステータス: UF2ファイルを選択してください。</div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
    </div>

    <script>
        const resetBtn = document.getElementById('resetBtn');
        const writeBtn = document.getElementById('writeBtn');
        const fileInput = document.getElementById('uf2File');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        let uf2Data = null;

        fileInput.addEventListener('change', async () => {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const arrayBuffer = await file.arrayBuffer();
                uf2Data = new Uint8Array(arrayBuffer);
                statusDiv.innerText = "👍 ファイル読み込み完了。[ステップ 1] を押してください。";
            }
        });

        // STEP 1: 1200bpsリセット (これはWeb Serialで行うのが最も確実)
        resetBtn.addEventListener('click', async () => {
            if (!uf2Data) return alert("先にUF2ファイルを選択してください。");
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 1200 });
                await port.close(); 
                statusDiv.innerText = "⏳ リセット成功。ほたる点滅に変わったら [ステップ 2] を押してください。";
                writeBtn.disabled = false;
                resetBtn.disabled = true;
            } catch (error) {
                statusDiv.innerText = `❌ リセットエラー: ${error.message}`;
            }
        });

        // STEP 2: WebUSBを用いたUF2のダイレクトバルク転送
        writeBtn.addEventListener('click', async () => {
            if (!uf2Data) return;
            let device;

            try {
                statusDiv.innerText = "WebUSBデバイスの選択を待っています...";
                // Adafruit / Seeed のブートローダー(MSC/UF2)のクラスにアクセス
                device = await navigator.usb.requestDevice({ filters: [] }); 
                
                statusDiv.innerText = "デバイスを開いています...";
                await device.open();
                
                // 構成とインターフェースの有効化 (UF2/MSC用バルクエンドポイントの取得)
                await device.selectConfiguration(1);
                
                // ブートローダーのインターフェース(通常はMSC用のインターフェース番号)を探してクレーム
                let interfaceNum = 0; 
                // 環境によって異なる場合があるため、自動で見つからない場合は手動でインターフェース番号を設定
                await device.claimInterface(interfaceNum);

                statusDiv.innerText = "フラッシュメモリへUF2データを書き込み中...";
                progressContainer.style.display = 'block';

                const chunkSize = 512;
                const totalChunks = uf2Data.length / chunkSize;

                // TinyUF2は特定のエンドポイント(通常はOUTエンドポイント 1 または 2)へ512バイトのセクタをそのまま投げることで
                // ブートローダー内部のロジックが走り、自動で書き込みと終了後の再起動を行います。
                let endpointOut = 1; 

                for (let i = 0; i < uf2Data.length; i += chunkSize) {
                    const chunk = uf2Data.slice(i, i + chunkSize);
                    
                    // WebUSBによる物理バルク転送
                    await device.transferOut(endpointOut, chunk);

                    const currentChunk = (i / chunkSize) + 1;
                    const percent = Math.round((currentChunk / totalChunks) * 100);
                    progressBar.style.width = `${percent}%`;
                    progressBar.innerText = `${percent}%`;
                }

                statusDiv.innerText = "書き込み完了。再起動をリクエスト中...";
                
                // インターフェースの解放とクローズ
                await device.releaseInterface(interfaceNum);
                await device.close();

                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
                statusDiv.innerText = "✨ アップデート成功！XIAOが正常に再起動しました。";
                
                resetBtn.disabled = false;
                writeBtn.disabled = true;

            } catch (error) {
                console.error(error);
                statusDiv.style.background = "#f8d7da";
                statusDiv.style.color = "#721c24";
                statusDiv.innerText = `❌ エラー: ${error.message} (インターフェースまたはエンドポイントの不一致の可能性があります)`;
                if (device) await device.close();
            }
        });
    </script>
</body>
</html>
