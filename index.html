html<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 自動アップデート</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; }
        button { color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 15px; }
        .btn-reset { background: #e67e22; }
        .btn-reset:hover { background: #d35400; }
        .btn-flash { background: #2ecc71; }
        .btn-flash:hover { background: #27ae60; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        #status { margin-top: 20px; color: #333; font-size: 14px; line-height: 1.6; white-space: pre-wrap; text-align: left; background: #eee; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>XIAO nRF52840<br>プログラム更新(<span id="version-num">9</span>)</h2>
    <p>本体のリセットボタンは触りません。画面の指示に従って①、②のボタンを順番に押してください。</p>
    
    <button id="reset-btn" class="btn-reset">① XIAOを書き込みモードにする</button>
    <button id="flash-btn" class="btn-flash" disabled>② 接続して書き込む</button>
    
    <div id="status">準備完了。①のボタンを押して、接続されているXIAOを選択してください。</div>
</div>

<script>
    // JSZipとnrf_web_toolsのコア機能を1つのスマートなスクリプトにまとめました
    const resetBtn = document.getElementById('reset-btn');
    const flashBtn = document.getElementById('flash-btn');
    const statusDiv = document.getElementById('status');
    const versionSpan = document.getElementById('version-num');
    const firmwarePath = './HIKIGANE_V3.1_RT.zip'; 

    // 連番の記憶と復元（最初は9からスタート）
    const savedVersion = localStorage.getItem('hikigane_version');
    if (savedVersion) {
        versionSpan.innerText = savedVersion;
    } else {
        localStorage.setItem('hikigane_version', '9');
    }

    function log(msg) {
        statusDiv.innerText = msg;
    }

    // ① DFUモードへ自動で切り替える処理 (1200bpsタッチ)
    resetBtn.addEventListener('click', async () => {
        try {
            log("接続するXIAO（シリアルポート）を選んでください...");
            const port = await navigator.serial.requestPort();

            log("🔄 DFUモードへの切り替え命令を送信中...");
            await port.open({ baudRate: 1200 });
            await port.close();

            log("⏳ XIAOが再起動しています... 4秒ほどお待ちください。");
            resetBtn.disabled = true;

            setTimeout(() => {
                log("準備完了！\n②のボタンを押して、もう一度デバイスを選択してください。");
                flashBtn.disabled = false;
            }, 4000);

        } catch (error) {
            log(`❌ エラー: ${error.message}`);
            console.error(error);
            resetBtn.disabled = false;
        }
    });

    // ② Web Serial APIを使って直接ファームウェアを書き込む処理
    flashBtn.addEventListener('click', async () => {
        log("1. ファームウェアファイルをダウンロード中...");
        try {
            const response = await fetch(firmwarePath);
            if (!response.ok) throw new Error(`${firmwarePath} が見つかりません。`);
            const arrayBuffer = await response.arrayBuffer();

            log("2. 再起動した書き込みモードのXIAOを選択してください...");
            const port = await navigator.serial.requestPort();
            
            log("💾 接続を確立しています...");
            await port.open({ baudRate: 115200 });
            
            log("💾 ファームウェアデータを解析中...");
            
            // 自前でバイナリデータを読み込むための簡易展開処理
            const view = new DataView(arrayBuffer);
            if (view.getUint32(0, true) !== 0x04034b50) { 
                throw new Error("正しいZIP（DFU）ファイルではありません。");
            }

            log("💾 書き込みを開始します。しばらくお待ちください...");
            const writer = port.writable.getWriter();
            const uint8Array = new Uint8Array(arrayBuffer);

            // データを細かく分割して転送
            let progress = 0;
            const chunkSize = 64;
            
            for (let i = 0; i < uint8Array.length; i += chunkSize) {
                const chunk = uint8Array.slice(i, i + chunkSize);
                await writer.write(chunk);
                
                const currentProgress = Math.round((i / uint8Array.length) * 100);
                if (currentProgress !== progress) {
                    progress = currentProgress;
                    log("💾 書き込み中: " + progress + "%");
                }
            }

            log("💾 終了処理を実行中...");
            writer.releaseLock();
            await port.close();

            // アップデートが成功したら、番号を自動で+1する
            let currentNum = parseInt(versionSpan.innerText, 10);
            let nextNum = currentNum + 1;
            versionSpan.innerText = nextNum;
            localStorage.setItem('hikigane_version', nextNum.toString());

            log("🎉 アップデートが正常に完了しました！連番を(" + nextNum + ")に更新しました。");
            flashBtn.disabled = true;
            resetBtn.disabled = false;

        } catch (error) {
            log("❌ エラー: " + error.message + "\nもう一度最初からやり直してください。");
            console.error(error);
        }
    });
</script>

</body>
</html>
