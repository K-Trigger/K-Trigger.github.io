<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIAO nRF52840 Web Uploader</title>
    
    <!-- 必要なライブラリ群 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
        h1 { color: #0066cc; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .step-box { background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        button { background-color: #0066cc; color: white; border: none; padding: 12px 24px; font-size: 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0052a3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { font-weight: bold; padding: 12px; border-radius: 4px; background: #eef; margin-top: 15px; border-left: 5px solid #0066cc; white-space: pre-wrap; }
        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 4px; margin-top: 15px; display: none; }
        .progress-bar { width: 0%; height: 20px; background-color: #28a745; border-radius: 4px; text-align: center; line-height: 20px; color: white; font-size: 12px; }
    </style>
</head>
<body>

    <h1>XIAO nRF52840 Web Flash Tool　06</h1>
    <p>ライブラリの正しい初期化ルールを適用したバージョンです。2つのステップで確実に実行します。</p>

    <div class="card">
        <!-- ファイル選択 -->
        <div class="step-box">
            <strong>📁 [準備] アップデート用 ZIP パッケージの選択</strong><br><br>
            <input type="file" id="zipFileInput" accept=".zip">
        </div>

        <!-- ステップ1 -->
        <div class="step-box">
            <strong>1️⃣ [ステップ 1] XIAOをリセットモードにする</strong>
            <p style="font-size: 13px; color:#666; margin: 5px 0;">通常動作中のXIAOのポートを選択してください。自動でホタル点滅に切り替わります。</p>
            <button id="resetBtn" disabled>XIAOを接続してリセット</button>
        </div>

        <!-- ステップ2 -->
        <div class="step-box">
            <strong>2️⃣ [ステップ 2] ファームウェアを書き込む</strong>
            <p style="font-size: 13px; color:#666; margin: 5px 0;">XIAOが赤/緑のホタル点滅に変わったら押してください。新しく出たブートローダーポートを選びます。</p>
            <button id="flashBtn" disabled>ブートローダーに接続して書き込み</button>
        </div>

        <!-- 状態と進捗状況 -->
        <div id="status">ステータス: ライブラリを読み込んでいます...</div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
    </div>

    <script>
        const zipFileInput = document.getElementById('zipFileInput');
        const resetBtn = document.getElementById('resetBtn');
        const flashBtn = document.getElementById('flashBtn');
        const statusDiv = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        let zipDataBuffer = null;

        // 画面読み込み時にライブラリの存在をチェックする安全機構
        window.addEventListener('load', () => {
            if (window.Nrfutil) {
                statusDiv.innerText = "ステータス: 準備完了。DFU用ZIPファイルを選択してください。";
            } else {
                statusDiv.style.background = "#f8d7da";
                statusDiv.style.color = "#721c24";
                statusDiv.innerText = "❌ エラー: 書き込み用ライブラリ(Nrfutil)の読み込みに失敗しました。\nネット接続を確認するか、ブラウザをリロードしてください。";
            }
        });

        // 📂 ZIPファイルが選択された時の処理
        zipFileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            try {
                const file = files[0];
                const arrayBuffer = await file.arrayBuffer();
                zipDataBuffer = new Uint8Array(arrayBuffer);
                
                statusDiv.innerText = "👍 ZIPファイルの読み込み完了！\n[ステップ 1] のボタンを押して通常ポートを選択してください。";
                resetBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = `❌ ファイル読み込みエラー: ${err.message}`;
                resetBtn.disabled = true;
                flashBtn.disabled = true;
            }
        });

        // 1️⃣ 【STEP 1】 1200bpsリセット
        resetBtn.addEventListener('click', async () => {
            if (!zipDataBuffer) return;
            try {
                statusDiv.innerText = "通常動作中のXIAOポートを選択してください...";
                const port = await navigator.serial.requestPort();
                
                statusDiv.innerText = "XIAOにリセット信号(1200bps)を送信中...";
                await port.open({ baudRate: 1200 });
                await port.close(); 
                
                statusDiv.innerText = "⏳ リセット成功！\nXIAO本体のランプが緑/赤の「ホタル点滅」に変わったことを確認してから、[ステップ 2] を押してください。";
                flashBtn.disabled = false;
                resetBtn.disabled = true;
            } catch (err) {
                statusDiv.innerText = `❌ リセットエラー: ${err.message}`;
            }
        });

        // 2️⃣ 【STEP 2】 正しいAPI構造に修正した書き込み処理
        flashBtn.addEventListener('click', async () => {
            if (!zipDataBuffer) return;
            
            try {
                statusDiv.innerText = "新しく出現した「ブートローダーのCOMポート」を選択してください...";
                const dfuPort = await navigator.serial.requestPort();
                
                statusDiv.innerText = "書き込みオブジェクトを初期化中...";
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressBar.innerText = '0%';

                // 💡【コア修正】nrfutil-jsライブラリの正しいブラウザ向けAPI呼び出し手順
                // 1. まず Web Serial ポートを引数にして、Dfuトランスポートを生成する
                const transport = new window.Nrfutil.WebSerialTransport(dfuPort);
                
                // 2. Dfu処理を行う本体（クラス）を新しく生成（インスタンス化）する
                const dfu = new window.Nrfutil.Dfu(transport);

                statusDiv.innerText = "nrfutilによる書き込みを開始します...";
                
                // 3. 生成したインスタンスに対して、ZIPデータと進捗コールバックを渡して実行
                await dfu.performDFU(zipDataBuffer, (progress) => {
                    const percent = Math.round(progress * 100);
                    progressBar.style.width = `${percent}%`;
                    progressBar.innerText = `${percent}%`;
                    statusDiv.innerText = `ファームウェア本体を転送中... (${percent}%)`;
                });
                
                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
                statusDiv.innerText = "✨ アップデート大成功！\nデータが100%正常に受理され、XIAOが通常モードで自動起動しました！";
                
                resetBtn.disabled = false;
                flashBtn.disabled = true;

            } catch (err) {
                console.error(err);
                statusDiv.style.background = "#f8d7da";
                statusDiv.style.color = "#721c24";
                statusDiv.innerText = `❌ 書き込みエラー: ${err.message}`;
            }
        });
    </script>
</body>
</html>
